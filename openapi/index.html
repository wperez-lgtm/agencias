<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API de disponibilidad</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <style>
    :root { --ink: #002554; --ink-soft: #0e3b68; --sea: #009aa1; --bg: #f3f3f5; }
    body { margin: 0; background: var(--bg); }
    .brand { background: var(--ink); color: #fff; padding: 22px 16px; font: 300 22px/1.2 Roboto, sans-serif; letter-spacing: .02em; }
    .brand span { display: block; max-width: 1200px; margin: 0 auto; }
    .swagger-ui, .swagger-ui .info .title, .swagger-ui .opblock-tag, .swagger-ui .opblock .opblock-summary-description,
    .swagger-ui .btn, .swagger-ui table thead tr th, .swagger-ui .parameter__name, .swagger-ui .response-col_status { font-family: Roboto, sans-serif; }
    .swagger-ui .wrapper { max-width: 1200px; padding: 0 16px; }
    .swagger-ui .info .title { color: var(--ink); font-weight: 300; }
    .swagger-ui * { border-radius: 0 !important; }
    .swagger-ui .opblock { border: 0; box-shadow: 0 2px 10px rgba(0, 37, 84, .10); background: #fff; }
    .swagger-ui .opblock .opblock-summary { border: 0; }
    .swagger-ui .opblock.opblock-get { background: #fff; }
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: var(--sea); }
    .swagger-ui .opblock.opblock-get .tab-header .tab-item.active h4 span::after { background: var(--sea); }
    .swagger-ui .btn.execute { background: var(--ink); border: 0; color: #fff; }
    .swagger-ui .btn.execute:hover { background: var(--ink-soft); }
    .swagger-ui .opblock-tag { border-bottom: 0; color: var(--ink); }
    .swagger-ui section.models { border: 0; background: #fff; box-shadow: 0 2px 10px rgba(0, 37, 84, .10); }
    .swagger-ui section.models .model-container,
    .swagger-ui section.models .model-container:hover { background: #f8f9fa; }
    .swagger-ui section.models .model-box,
    .swagger-ui section.models .model-box button,
    .swagger-ui section.models .json-schema-2020-12-accordion,
    .swagger-ui section.models .json-schema-2020-12-expand-deep-button { background: transparent; }
    .swagger-ui section.models .json-schema-2020-12__title,
    .swagger-ui section.models .model-title { color: var(--ink); }
    .swagger-ui section.models .json-schema-2020-12-expand-deep-button { color: #317782; font-weight: 500; }
  </style>
</head>
<body>
  <header class="brand"><span>Galaxy Cruises · API de disponibilidad</span></header>
  <div id="swagger-ui"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script src="swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: 'availability.openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'list',
      tryItOutEnabled: true,
      validatorUrl: null,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout'
    });
  </script>
</body>
</html>
